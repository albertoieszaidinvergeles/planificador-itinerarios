# Dependabot · actualizaciones automáticas / automatic updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# Una actualización al mes por ecosistema, con PRs revisables / Monthly updates per ecosystem.

version: 2
updates:
  - package-ecosystem: npm
    directories:
      - "/app1/frontend"
      - "/app2/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: pip
    directories:
      - "/app1/backend"
      - "/app2/backend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
